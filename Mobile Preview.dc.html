<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0;background:#1b1b1b}a{color:#e6e4df}a:hover{color:#b3a37e}</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:20px;padding:32px 16px;box-sizing:border-box;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#a8a49b">
  <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
    <sc-for list="{{ devices }}" as="dv" hint-placeholder-count="3">
      <button onClick="{{ dv.pick }}" style="background:{{ dv.bg }};color:{{ dv.fg }};border:1px solid {{ dv.bd }};padding:7px 14px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;font-family:inherit">{{ dv.label }}</button>
    </sc-for>
  </div>
  <div style="padding:12px;background:#0d0d0d;border-radius:48px;box-shadow:0 0 0 1px #333,0 30px 80px rgba(0,0,0,.5)">
    <iframe src="INNI Label.dc.html" title="Mobile preview" style="display:block;width:{{ w }};height:{{ h }};border:0;border-radius:36px;background:#262626"></iframe>
  </div>
  <span style="font-size:11px;letter-spacing:.1em;text-transform:uppercase">{{ size }} · live site, fully clickable</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const DEVICES = [
  { label: 'iPhone SE', w: 375, h: 667 },
  { label: 'iPhone 15', w: 393, h: 852 },
  { label: 'Android', w: 412, h: 915 },
];
class Component extends DCLogic {
  state = { i: 1 };
  renderVals() {
    const d = DEVICES[this.state.i];
    return {
      w: d.w + 'px', h: d.h + 'px', size: d.label + ' · ' + d.w + '×' + d.h,
      devices: DEVICES.map((x, j) => {
        const on = j === this.state.i;
        return { label: x.label, pick: () => this.setState({ i: j }), bg: on ? '#e6e4df' : 'transparent', fg: on ? '#262626' : '#e6e4df', bd: on ? '#e6e4df' : 'rgba(230,228,223,.28)' };
      }),
    };
  }
}
</script>
</body>
</html>
